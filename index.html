<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CargoWise-ish MVP</title>
  <style>
    :root{--bg1:#071224;--bg2:#0a2a45;--card:#0b1a33cc;--text:#e9f1ff;--muted:#9fb6d7;--ok:#9fffb0;--err:#ff7b7b;--shadow:0 20px 60px rgba(0,0,0,.45);--r:16px;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);
      background:radial-gradient(900px 500px at 20% 30%, rgba(35,110,255,.35), transparent 60%),
                radial-gradient(800px 500px at 75% 70%, rgba(0,255,225,.18), transparent 55%),
                linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;justify-content:center;align-items:flex-start;padding:54px 16px}
    .wrap{width:min(1040px,100%);display:grid;gap:18px;justify-items:center}
    .card{width:min(860px,100%);background:var(--card);border:1px solid rgba(255,255,255,.10);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(10px)}
    .head{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center;background:linear-gradient(180deg, rgba(255,255,255,.03), transparent)}
    .dot{width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#3fbbff,#00ffc4)}
    .title{font-weight:800;font-size:14px}
    .sub{opacity:.75;font-size:12px;margin-top:2px}
    .body{padding:18px}
    h2{margin:0 0 12px;font-size:14px}
    label{display:block;opacity:.75;font-size:12px;margin:10px 0 6px}
    input,select{width:100%;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.07);color:var(--text);padding:0 12px;outline:none}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
    button{cursor:pointer;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.09);color:var(--text);padding:0 14px;font-weight:800}
    .primary{background:linear-gradient(180deg,#1f63ff,#0f3db3)}
    .good{background:linear-gradient(180deg,#00c896,#008c6e)}
    .hidden{display:none}
    #status{margin-top:10px;font-size:12px;opacity:.9;word-break:break-word}
    #badge{margin-top:8px;font-size:12px;opacity:.95;word-break:break-word}
    .build{margin-top:10px;font-size:11px;opacity:.75;font-family:var(--mono)}
    .section{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
    .chip{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(15,36,70,.8);border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:12px}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
    th,td{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 8px;text-align:left}
    th{color:var(--muted);font-weight:900}
    tr:hover{background:rgba(255,255,255,.03)}
    .mono{font-family:var(--mono)}
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card" id="loginCard">
      <div class="head">
        <div class="dot"></div>
        <div>
          <div class="title">CargoWise-ish MVP</div>
          <div class="sub">Login to manage jobs & charges</div>
        </div>
      </div>
      <div class="body">
        <h2>Sign in</h2>
        <label>Email</label>
        <input id="email" type="email" autocomplete="username"/>
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password"/>
        <div class="btnbar">
          <button id="btnLogin" class="primary">Login</button>
          <button id="btnLogout" class="hidden">Logout</button>
        </div>
        <div id="status">Ready.</div>
        <div id="badge"></div>
        <div class="build" id="buildMarker">BUILD: RECOVERY-3 (HTML)</div>
      </div>
    </div>

    <div class="card hidden" id="appCard">
      <div class="head">
        <div class="dot"></div>
        <div>
          <div class="title">Operations</div>
          <div class="sub">Jobs • Charges</div>
        </div>
      </div>
      <div class="body">

        <div class="row2">
          <div>
            <label>Branch</label>
            <select id="branch"></select>
          </div>
          <div style="display:flex;align-items:flex-end">
            <span class="chip">Current Job: <span id="currentJobNo" class="mono">None</span></span>
          </div>
        </div>

        <div class="section">
          <h2>Jobs</h2>
          <div class="row3">
            <div><label>Country</label><input id="country" placeholder="SG"/></div>
            <div>
              <label>Transport</label>
              <select id="transport_mode">
                <option value="S">S (Sea)</option><option value="A">A (Air)</option>
                <option value="L">L (Land)</option><option value="I">I (Integrated)</option>
              </select>
            </div>
            <div>
              <label>Job Type</label>
              <select id="job_type"><option value="O">O (Export)</option><option value="I">I (Import)</option></select>
            </div>
          </div>
          <div class="row2" style="margin-top:10px">
            <div><label>Customer</label><input id="customer" placeholder="Customer / Shipper"/></div>
            <div style="display:flex;align-items:flex-end;gap:10px">
              <button id="btnCreateJob" class="good" style="width:100%">Create Job</button>
            </div>
          </div>
          <div class="btnbar">
            <button id="btnRefreshJobs">Refresh Jobs</button>
          </div>
          <table>
            <thead><tr><th>Job No</th><th>Country</th><th>Branch</th><th>Mode</th><th>Type</th><th>Customer</th></tr></thead>
            <tbody id="jobsTableBody"></tbody>
          </table>
        </div>

        <div class="section">
          <h2>Charges</h2>
          <div class="row3">
            <div><label>Charge Code</label><input id="charge_code" placeholder="FRT / DOC / THC"/></div>
            <div><label>Amount</label><input id="amount" placeholder="100.00"/></div>
            <div><label>Currency</label><input id="currency" placeholder="USD"/></div>
          </div>
          <div class="row2" style="margin-top:10px">
            <div>
              <label>Type</label>
              <select id="charge_type"><option value="SELL">SELL</option><option value="BUY">BUY</option></select>
            </div>
            <div style="display:flex;align-items:flex-end">
              <button id="btnAddCharge" class="good" style="width:100%">Add Charge</button>
            </div>
          </div>
          <div class="btnbar">
            <button id="btnRefreshCharges">Refresh Charges</button>
          </div>
          <table>
            <thead><tr><th>Code</th><th>Amount</th><th>Currency</th><th>Type</th></tr></thead>
            <tbody id="chargesTableBody"></tbody>
          </table>

          <div class="build">BUILD: RECOVERY-3 (UI has #branch/#jobsTableBody)</div>
        </div>

      </div>
    </div>

  </div>

  <!-- ✅ Correct script tag -->
  <script src="./app.js?v=recovery3ody>
</html>
