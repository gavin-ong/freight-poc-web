<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freight PRD POC</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 18px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; }
    input, select, button, textarea { padding: 6px; }
    textarea { width: 420px; height: 50px; }
    hr { margin: 18px 0; }
    .muted { color:#666; font-size:12px; }
    ul { margin-top:8px; }
    .box { border:1px solid #ddd; padding:10px; border-radius:8px; margin:10px 0; }
    .box h3 { margin: 0 0 10px 0; }
    .pill { background:#f3f3f3; padding:2px 8px; border-radius:999px; }
    .two-col { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 900px){ .two-col { grid-template-columns: 1fr; } }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>

<body>
  <h2>Login</h2>
  <div class="row">
    <input id="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button onclick="login()">Login</button>
    <div id="loginStatus" class="muted"></div>
  </div>

  <hr />

  <div class="two-col">
    <!-- LEFT: Job creation -->
    <div class="box">
      <h3>Create Job (CargoWise Format)</h3>

      <div class="row">
        <label>Branch</label>
        <select id="branchKey" disabled>
          <option value="">Login to load branches…</option>
        </select>

        <label>Mode</label>
        <select id="mode">
          <option value="SEA">SEA (S)</option>
          <option value="AIR">AIR (A)</option>
          <option value="LAND">LAND (L)</option>
          <option value="INTEGRATED">INTEGRATED (I)</option>
        </select>

        <label>Job Type</label>
        <select id="jobType">
          <option value="EXPORT">EXPORT (O)</option>
          <option value="IMPORT">IMPORT (I)</option>
        </select>

        <label>Incoterm</label>
        <select id="incoterm">
          <option value="FOB">FOB</option>
          <option value="CIF">CIF</option>
          <option value="EXW">EXW</option>
        </select>
      </div>

      <div class="row">
        <input id="customer" placeholder="Customer Name (e.g. CUST-001)" />
        <input id="origin" placeholder="Origin Country (e.g. CN)" />
        <input id="destination" placeholder="Destination Country (e.g. SG)" />
        <button onclick="createJob()">Create Job</button>
      </div>

      <div class="row muted">
        <span class="pill">Job no generated by DB RPC</span>
        <span class="pill">YYMM follows branch-local date</span>
      </div>
    </div>

    <!-- RIGHT: Shipment module -->
    <div class="box">
      <h3>Shipment + Milestones</h3>

      <div class="row">
        <label>Job</label>
        <select id="jobSelect" disabled>
          <option value="">Login to load jobs…</option>
        </select>
        <button onclick="loadJobs()">Reload Jobs</button>
      </div>

      <div class="row">
        <input id="pol" placeholder="POL (e.g. CNSHA)" />
        <input id="pod" placeholder="POD (e.g. SGSIN)" />
        <input id="carrier" placeholder="Carrier (e.g. PIL)" />
        <input id="vesselFlight" placeholder="Vessel/Flight (e.g. KOTA XXX)" />
      </div>

      <div class="row">
        <input id="bookingNo" placeholder="Booking No" />
        <input id="blAwbNo" placeholder="BL/AWB No" />
        <input id="voyage" placeholder="Voyage (optional)" />
        <button onclick="createShipment()">Create Shipment</button>
      </div>

      <hr />

      <div class="row">
        <label>Shipment</label>
        <select id="shipmentSelect" disabled>
          <option value="">Select a job first…</option>
        </select>
        <button onclick="loadShipments()">Reload Shipments</button>
      </div>

      <div class="row">
        <label>Event</label>
        <select id="eventCode">
          <option value="ETD">ETD</option>
          <option value="ATD">ATD</option>
          <option value="ETA">ETA</option>
          <option value="ATA">ATA</option>
          <option value="GATE_IN">GATE_IN</option>
          <option value="LOADED">LOADED</option>
          <option value="DEPARTED">DEPARTED</option>
          <option value="ARRIVED">ARRIVED</option>
          <option value="DELIVERED">DELIVERED</option>
        </select>

        <input id="eventTime" type="datetime-local" />
        <input id="eventLocation" placeholder="Location (optional)" />
        <button onclick="addEvent()">Add Event</button>
      </div>

      <div class="row">
        <textarea id="eventRemarks" placeholder="Remarks (optional)"></textarea>
      </div>

      <div class="muted">
        Times displayed using the selected job’s branch timezone.
      </div>
    </div>
  </div>

  <hr />

  <h2>Jobs List</h2>
  <div class="row">
    <button onclick="loadJobs()">Refresh Jobs</button>
    <span class="muted">Shows latest 50</span>
  </div>
  <ul id="jobsList"></ul>

  <hr />

  <h2>Shipments + Events (Selected Job)</h2>
  <div id="shipmentsPanel" class="muted">Select a job to view shipments.</div>

  <!-- cache buster -->
  <script src="./app.js?v=shipments_module_1"></script>
</body>
</html>
