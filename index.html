<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freight PRD POC</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 12px; }
    .top { margin-bottom: 10px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    input, select, button { padding: 4px 6px; font-size: 12px; }
    .grid { display:grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
    .card { border:1px solid #ccc; padding:10px; border-radius:4px; }
    .muted { color:#666; font-size: 11px; }
    h3 { margin: 0 0 8px 0; font-size: 14px; }
    hr { margin: 10px 0; }
    ul { margin: 6px 0 0 18px; }
    .jobs { margin-top: 12px; }
    .small { font-size: 11px; }
    textarea { width: 100%; min-height: 70px; font-size: 12px; padding: 6px; }
    .w120 { width: 120px; }
    .w140 { width: 140px; }
    .w160 { width: 160px; }
    .w200 { width: 200px; }
    .w260 { width: 260px; }
  </style>
</head>

<body>

  <div class="top">
    <h3>Login</h3>
    <div class="row">
      <input id="email" class="w260" placeholder="Email" autocomplete="username" />
      <input id="password" class="w200" type="password" placeholder="Password" autocomplete="current-password" />
      <button onclick="login()">Login</button>
      <span id="loginStatus" class="muted"></span>
    </div>
  </div>

  <div class="grid">
    <!-- LEFT: Create Job -->
    <div class="card">
      <h3>Create Job (CargoWise Format)</h3>

      <div class="row">
        <label class="small">Branch</label>
        <select id="branchKey" class="w200" disabled>
          <option value="">Login to load branches...</option>
        </select>

        <label class="small">Mode</label>
        <select id="mode" class="w120">
          <option value="SEA">SEA (S)</option>
          <option value="AIR">AIR (A)</option>
          <option value="LAND">LAND (L)</option>
          <option value="INTEGRATED">INTEGRATED (I)</option>
        </select>

        <label class="small">Job Type</label>
        <select id="jobType" class="w120">
          <option value="EXPORT">EXPORT (O)</option>
          <option value="IMPORT">IMPORT (I)</option>
        </select>

        <label class="small">Incoterm</label>
        <select id="incoterm" class="w120">
          <option value="FOB">FOB</option>
          <option value="CIF">CIF</option>
          <option value="EXW">EXW</option>
        </select>
      </div>

      <div class="row">
        <input id="customer" class="w200" placeholder="Customer Name (e.g. CUST-001)" />
        <input id="origin" class="w160" placeholder="Origin Country (e.g. CN)" />
        <input id="destination" class="w160" placeholder="Destination Country (e.g. SG)" />
        <button onclick="createJob()">Create Job</button>
      </div>

      <div class="row muted">
        <span>Job no generated by DB RPC</span>
        <span>YYMM follows branch-local date</span>
      </div>
    </div>

    <!-- RIGHT: Shipment + Milestones -->
    <div class="card">
      <h3>Shipment + Milestones</h3>

      <div class="row">
        <label class="small">Job</label>
        <select id="jobSelect" class="w260" disabled>
          <option value="">Login to load jobs...</option>
        </select>
        <button onclick="reloadJobs()">Reload Jobs</button>
      </div>

      <div class="row">
        <input id="pol" class="w140" placeholder="POL (e.g. CNSHA)" />
        <input id="pod" class="w140" placeholder="POD (e.g. SGSIN)" />
        <input id="carrier" class="w140" placeholder="Carrier (e.g. PIL)" />
        <input id="vessel" class="w160" placeholder="Vessel/Flight (e.g. KOTA XX)" />
      </div>

      <div class="row">
        <input id="bookingNo" class="w140" placeholder="Booking No" />
        <input id="blAwbNo" class="w140" placeholder="BL/AWB No" />
        <input id="voyage" class="w140" placeholder="Voyage (optional)" />
        <button onclick="createShipment()">Create Shipment</button>
      </div>

      <hr />

      <div class="row">
        <label class="small">Shipment</label>
        <select id="shipmentSelect" class="w260" disabled>
          <option value="">Select a job first...</option>
        </select>
        <button onclick="reloadShipments()">Reload Shipments</button>
      </div>

      <div class="row">
        <label class="small">Event</label>
        <select id="eventName" class="w120">
          <option value="ETD">ETD</option>
          <option value="ATD">ATD</option>
          <option value="ETA">ETA</option>
          <option value="ATA">ATA</option>
          <option value="GATE_IN">GATE_IN</option>
          <option value="LOADED">LOADED</option>
          <option value="DEPARTED">DEPARTED</option>
          <option value="ARRIVED">ARRIVED</option>
        </select>

        <input id="eventTime" type="datetime-local" class="w200" />
        <input id="eventLocation" class="w200" placeholder="Location (optional)" />
        <button onclick="addEvent()">Add Event</button>
      </div>

      <div class="row">
        <textarea id="eventRemarks" placeholder="Remarks (optional)"></textarea>
      </div>

      <div class="muted">Times displayed using the selected job’s branch timezone.</div>
    </div>
  </div>

  <div class="jobs">
    <h3>Jobs List</h3>
    <div class="row">
      <button onclick="loadJobsList()">Refresh Jobs</button>
      <span class="muted">Shows latest 50</span>
    </div>

    <ul id="jobsList"></ul>

    <hr />

    <h3>Shipments + Events (Selected Job)</h3>
    <div id="shipmentsArea" class="muted">Select a job to view shipments.</div>
  </div>

  <script src="./app.js?v=shipments_full_20260512"></script>
</body>
</html>
