<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CargoWise-ish MVP</title>

  <style>
    :root{--bg1:#071224;--bg2:#0a2a45;--card:#0b1a33cc;--text:#e9f1ff;--muted:#9fb6d7;--shadow:0 20px 60px rgba(0,0,0,.45);--r:16px;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);
      background:radial-gradient(900px 500px at 20% 30%, rgba(35,110,255,.35), transparent 60%),
                radial-gradient(800px 500px at 75% 70%, rgba(0,255,225,.18), transparent 55%),
                linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;justify-content:center;align-items:flex-start;padding:54px 16px}
    .wrap{width:min(1040px,100%);display:grid;gap:18px;justify-items:center}
    .card{width:min(860px,100%);background:var(--card);border:1px solid rgba(255,255,255,.10);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(10px)}
    .head{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center;background:linear-gradient(180deg, rgba(255,255,255,.03), transparent)}
    .dot{width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#3fbbff,#00ffc4)}
    .title{font-weight:800;font-size:14px}
    .sub{opacity:.75;font-size:12px;margin-top:2px}
    .body{padding:18px}
    .hidden{display:none !important}
    .build{margin-top:10px;font-size:11px;opacity:.75;font-family:var(--mono)}
    .banner{
      width:min(860px,100%);
      background:rgba(255,0,70,.12);
      border:1px solid rgba(255,0,70,.35);
      border-radius:14px;
      padding:14px 16px;
      box-shadow:0 16px 40px rgba(0,0,0,.35);
    }
    .banner h3{margin:0 0 6px;font-size:13px}
    .banner p{margin:0;font-size:12px;opacity:.95;line-height:1.35}
    a{color:#9fffb0}
  </style>
</head>

<body>
  <div class="wrap">

    <!-- If JavaScript is blocked/disabled, this WILL show automatically -->
    <noscript>
      <div class="banner">
        <h3>⚠️ JavaScript is blocked in this browser/session</h3>
        <p>
          This app requires JavaScript to run (login, load branches, jobs, charges).<br/>
          You appear to be running inside a corporate browser isolation / SafeView mode that blocks scripts.<br/><br/>
          <b>Fix:</b> open this site outside SafeView / browser isolation, or use Incognito with extensions disabled, or a non-corporate network/device.
        </p>
      </div>
    </noscript>

    <!-- Your existing UI can stay as-is -->
    <div class="card" id="appCard">
      <div class="head">
        <div class="dot"></div>
        <div>
          <div class="title">Operations</div>
          <div class="sub">Jobs • Charges</div>
        </div>
      </div>
      <div class="body">
        <div class="build" id="buildMarker">BUILD: RECOVERY-3D+NOSCRIPT</div>
        <div style="opacity:.75;font-size:12px;margin-top:8px">
          If you can’t click anything and nothing loads, scripts are being blocked by the browser policy.
        </div>
      </div>
    </div>

  </div>

  <!-- Proper script tag -->
  <script src="./app.js?v=recovery/body>
</html>
