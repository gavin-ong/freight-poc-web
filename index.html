<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HEARTBEAT LIVE ✅</title>
  <style>
    body{
      margin:0; min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#e9f1ff;
      background:
        radial-gradient(900px 500px at 20% 30%, rgba(35,110,255,.35), transparent 60%),
        radial-gradient(800px 500px at 75% 70%, rgba(0,255,225,.18), transparent 55%),
        linear-gradient(180deg, #071224, #0a2a45);
      display:flex; justify-content:center; align-items:flex-start;
      padding:54px 16px;
    }
    .card{
      width:min(860px, 100%);
      background:rgba(11,26,51,.85);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .head{
      padding:18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex; gap:12px; align-items:center;
      background:linear-gradient(180deg, rgba(255,255,255,.03), transparent);
    }
    .dot{
      width:28px; height:28px; border-radius:10px;
      background:linear-gradient(135deg, #3fbbff, #00ffc4);
    }
    .title{font-weight:900; font-size:18px;}
    .sub{opacity:.75; font-size:12px; margin-top:3px;}
    .body{padding:18px;}
    .build{margin-top:10px; font-size:12px; opacity:.9; font-family: ui-monospace, Menlo, Consolas, monospace;}
    .statusLine{
      margin-top:12px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      font-weight:900;
    }
    .bad{ color:#ff7b7b; border-color: rgba(255,123,123,.35); background: rgba(255,123,123,.08); }
    .good{ color:#9fffb0; border-color: rgba(159,255,176,.35); background: rgba(159,255,176,.08); }
  </style>
</head>

<body>
  <div class="card">
    <div class="head">
      <div class="dot"></div>
      <div>
        <div class="title">HEARTBEAT LIVE ✅</div>
        <div class="sub">If these do not turn green, scripts are not running.</div>
      </div>
    </div>

    <div class="body">
      <div class="build">BUILD: HEARTBEAT-2 (HTML)</div>

      <div id="jsInline" class="statusLine bad">JS (inline): NOT RUNNING</div>
      <div id="jsApp" class="statusLine bad">JS (app.js): NOT RUNNING</div>

      <noscript>
        <div class="statusLine bad">NOSCRIPT: JavaScript is disabled</div>
      </noscript>
    </div>
  </div>

  <!-- Inline heartbeat -->
  <script>
    (function(){
      var el = document.getElementById("jsInline");
      if (el){
        el.textContent = "JS (inline): RUNNING ✅";
        el.classList.remove("bad"); el.classList.add("good");
      }
    })();
  </script>

  <!-- External heartbeat -->
  <script src="./app.js?v=heartbeat2"></script>
</body>
</html>
``
