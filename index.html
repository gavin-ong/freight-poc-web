<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freight PRD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    input, select, button { margin: 6px 0; padding: 8px; width: 360px; max-width: 100%; }
    button { width: auto; cursor: pointer; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .box { padding: 10px; border: 1px solid #eee; background: #fafafa; margin-top: 10px; border-radius: 6px; }
    .card { border:1px solid #ddd; border-radius:10px; padding:12px; margin:12px 0; }
    .ok { color:#0a7a0a; }
    .err { color:#b00020; }
    .muted { color:#666; }
    code { background:#f3f3f3; padding:2px 6px; border-radius:4px; }
  </style>
</head>

<body>
  <h2>Freight PRD</h2>
  <div class="muted">Jobs + Assignments + Events (Cargowise-like skeleton)</div>

  <!-- 🔥 If you don't see this exact version number after deploy, you're NOT on the latest file -->
  <div class="box muted">
    <b>APP_VERSION:</b> <code>2026-05-11_v7</code>
  </div>

  <div id="status" class="box muted">Not logged in.</div>

  <div class="card">
    <h3>Login</h3>
    <input id="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div class="row">
      <button id="btnLogin" type="button">Login</button>
      <button id="btnLogout" type="button">Logout</button>
    </div>
    <div id="authMsg" class="box muted">Ready.</div>
  </div>

  <div id="app" style="display:none;">
    <div class="card">
      <h3>Create Job</h3>
      <input id="job_no" placeholder="Job No (unique)" />
      <input id="branch_code" value="SGP-HQ" placeholder="Branch Code (e.g. SGP-HQ)" />
      <select id="job_status">
        <option value="CREATED">CREATED</option>
        <option value="ASSIGNED">ASSIGNED</option>
        <option value="ACCEPTED">ACCEPTED</option>
        <option value="IN-TRANSIT">IN-TRANSIT</option>
        <option value="ARRIVED">ARRIVED</option>
        <option value="COMPLETED">COMPLETED</option>
        <option value="INVOICED">INVOICED</option>
      </select>
      <div class="row">
        <button id="btnCreateJob" type="button">Create Job</button>
        <button id="btnRefreshJobs" type="button">Refresh Jobs</button>
      </div>
      <div id="jobMsg" class="box muted">No action yet.</div>
    </div>

    <div class="card">
      <h3>Jobs</h3>
      <div class="muted">Your PK is <code>jobs.job_id</code> (uuid).</div>
      <div id="jobs" class="box muted">No jobs loaded.</div>
    </div>
  </div>

  <!-- ✅ GUARANTEED browser UMD build (gives window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL = "https://quzputmmabgcfmegarvd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UG9E0FbUzetadkz8TQN2fg_pIWx3LTO";

    const statusBox = document.getElementById("status");
    const authMsg   = document.getElementById("authMsg");
    const jobMsg    = document.getElementById("jobMsg");
    const jobsDiv   = document.getElementById("jobs");
    const appDiv    = document.getElementById("app");
    const btnLogin  = document.getElementById("btnLogin");

    const setStatus  = (t, cls="muted") => { statusBox.className = "box " + cls; statusBox.textContent = t; };
    const setAuthMsg = (t, cls="muted") => { authMsg.className   = "box " + cls; authMsg.textContent   = t; };
    const setJobMsg  = (t, cls="muted") => { jobMsg.className    = "box " + cls; jobMsg.textContent    = t; };

    const esc = s => (s ?? "").toString().replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout after " + ms + "ms")), ms))
      ]);
    }

    // Hard fail if CDN/library blocked
    if (!window.supabase) {
      setStatus("❌ Supabase JS not loaded. CDN blocked.", "err");
      setAuthMsg("❌ Supabase JS not loaded. CDN blocked.", "err");
      throw new Error("Supabase JS not loaded");
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;

    document.getElementById("btnLogin").onclick = login;
    document.getElementById("btnLogout").onclick = logout;
    document.getElementById("btnCreateJob").onclick = createJob;
    document.getElementById("btnRefreshJobs").onclick = loadJobs;

    async function login() {
      // ✅ you will ALWAYS see this change immediately if JS is actually running
      setAuthMsg("Logging in...", "muted");
      btnLogin.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await withTimeout(
          sb.auth.signInWithPassword({ email, password }),
          20000
        );

        if (error) {
          setAuthMsg("❌ Login failed: " + error.message, "err");
          setStatus("Not logged in.", "muted");
          return;
        }

        currentUser = data.user;
        setAuthMsg("✅ Logged in: " + currentUser.email + " | " + currentUser.id, "ok");
        setStatus("Logged in.", "ok");
        appDiv.style.display = "block";
        await loadJobs();
      } catch (e) {
        setAuthMsg("❌ Login failed/stuck: " + e.message, "err");
        setStatus("Not logged in.", "muted");
      } finally {
        btnLogin.disabled = false;
      }
    }

    async function logout() {
      await sb.auth.signOut();
      currentUser = null;
      appDiv.style.display = "none";
      setAuthMsg("Logged out.", "muted");
      setStatus("Not logged in.", "muted");
    }

    // Background restore (non-blocking)
    (async () => {
      try {
        const { data: { session } } = await withTimeout(sb.auth.getSession(), 5000);
        if (session?.user) {
          currentUser = session.user;
          setAuthMsg("✅ Session restored: " + currentUser.email, "ok");
          setStatus("Logged in (restored).", "ok");
          appDiv.style.display = "block";
          await loadJobs();
        }
      } catch {
        // quiet
      }
    })();

    async function createJob() {
      if (!currentUser) return setJobMsg("❌ Login first.", "err");

      const job_no = document.getElementById("job_no").value.trim();
      const branch_code = document.getElementById("branch_code").value.trim() || "SGP-HQ";
      const status = document.getElementById("job_status").value;
      if (!job_no) return setJobMsg("❌ Job No required.", "err");

      setJobMsg("Creating job...", "muted");

      const { data, error } = await sb
        .from("jobs")
        .insert({ job_no, branch_code, status, created_by: currentUser.id })
        .select("job_id, job_no");

      if (error) return setJobMsg("❌ Create job failed: " + error.message, "err");

      setJobMsg("✅ Job created: " + data[0].job_no, "ok");
      document.getElementById("job_no").value = "";
      await loadJobs();
    }

    async function loadJobs() {
      const { data, error } = await sb
        .from("jobs")
        .select("job_id, job_no, branch_code, status, created_at")
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) {
        jobsDiv.className = "box err";
        jobsDiv.textContent = "❌ Load jobs failed: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        jobsDiv.className = "box muted";
        jobsDiv.textContent = "No jobs yet.";
        return;
      }

      jobsDiv.className = "box muted";
      jobsDiv.innerHTML = data.map(j => `
        <div><b>${esc(j.job_no)}</b> | ${esc(j.branch_code)} | ${esc(j.status)}
          <span class="muted">(${esc(j.created_at)})</span>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
``
