<!DOCTYPE html>
<html>
<head>
  <title>Freight PRD</title>
</head>
<body>

<h2>Login</h2>
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<hr>

<h2>Create Job</h2>
<input id="job_no" placeholder="Job No"><br>
<input id="branch_code" value="SGP-HQ" placeholder="Branch"><br>

<button onclick="createJob()">Create Job</button>

<hr>

<h2>Jobs</h2>
<div id="jobs"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://quzputmmabgcfmegarvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_UG9E0FbUzetadkz8TQN2fg_pIWx3LTO";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

async function login() {
  const { data, error } = await supabase.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = data.user;
  alert("Logged in");
  loadJobs();
}

async function logout() {
  await supabase.auth.signOut();
  currentUser = null;
  alert("Logged out");
}

async function createJob() {
  if (!currentUser) {
    alert("Login first");
    return;
  }

  const { error } = await supabase.from("jobs").insert({
    job_no: document.getElementById("job_no").value,
    branch_code: document.getElementById("branch_code").value,
    status: "CREATED",
    created_by: currentUser.id
  });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Job created");
  loadJobs();
}

async function loadJobs() {
  const { data, error } = await supabase
    .from("jobs")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("jobs").innerHTML =
    data.map(j => `
      <div>
        ${j.job_no} | ${j.branch_code} | ${j.status}
      </div>
    `).join("");
}

// auto load if session exists
supabase.auth.getSession().then(res => {
  if (res.data.session) {
    currentUser = res.data.session.user;
    loadJobs();
  }
});
</script>

</body>
</html>
