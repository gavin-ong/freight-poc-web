<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Freight PRD POC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 24px;
      max-width: 1000px;
    }
    h1 { margin-bottom: 4px; }
    .muted { color: #666; font-size: 13px; }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    input, button {
      padding: 8px;
      margin-top: 6px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 12px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

  <h1>Freight PRD POC</h1>
  <div class="muted">
    Real users · Real login · Real branch‑level security
  </div>

  <!-- LOGIN CARD -->
  <div class="card">
    <h2>Login</h2>

    <label>Email</label><br />
    <input id="email" type="email" placeholder="email" style="width:300px" /><br />

    <label>Password</label><br />
    <input id="password" type="password" placeholder="password" style="width:300px" /><br /><br />

    <button id="btnLogin">Login</button>
    <button id="btnLogout" style="display:none">Logout</button>

    <div id="authMsg" class="muted"></div>
  </div>

  <!-- APP CARD -->
  <div class="card" id="appCard" style="display:none">
    <h2>Jobs</h2>

    <div class="muted">
      Branch: <b><span id="branchLabel">-</span></b><br />
      User: <span id="userLabel">-</span>
    </div>

    <h3>Create Job</h3>
    <input id="jobNo" placeholder="Job No (e.g. POC-0002)" />
    <button id="btnCreate">Create Job</button>
    <div id="jobMsg" class="muted"></div>

    <h3>Job List</h3>
    <button id="btnRefresh">Refresh</button>

    <table>
      <thead>
        <tr>
          <th>Job No</th>
          <th>Branch</th>
          <th>Status</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody id="jobTable"></tbody>
    </table>
  </div>

  <!-- Supabase library -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Your app logic -->
  <script src="./app.js"></script>
</body>
</html>
