<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freight PRD - Auth Smoke Test</title>
  <style>
    body{font-family:Arial;margin:24px}
    input,button{padding:8px;margin:6px 0;width:340px;max-width:100%}
    button{width:auto}
    .box{padding:10px;border:1px solid #eee;background:#fafafa;margin-top:10px}
    .ok{color:#0a7a0a} .err{color:#b00020} .muted{color:#666}
  </style>
</head>
<body>
  <h2>Auth Smoke Test</h2>

  <input id="email" placeholder="Email" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <div>
    <button id="btnLogin">Login</button>
    <button id="btnLogout">Logout</button>
  </div>

  <div id="msg" class="box muted">Ready.</div>

  <!-- ✅ This MUST be a real script tag -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://quzputmmabgcfmegarvd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UG9E0FbUzetadkz8TQN2fg_pIWx3LTO";

    const msg = (t, cls="muted") => {
      const el = document.getElementById("msg");
      el.className = "box " + cls;
      el.textContent = t;
    };

    // Fail fast if library didn't load
    if (!window.supabase) {
      msg("❌ Supabase JS not loaded. If you can see this, CDN is blocked OR file is not updated.", "err");
      throw new Error("Supabase JS not loaded");
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById("btnLogin").onclick = async () => {
      msg("Logging in...", "muted");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return msg("❌ Login failed: " + error.message, "err");

      msg("✅ Logged in: " + data.user.email + " | " + data.user.id, "ok");
    };

    document.getElementById("btnLogout").onclick = async () => {
      await sb.auth.signOut();
      msg("Logged out.", "muted");
    };

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) msg("✅ Session restored: " + session.user.email, "ok");
      else msg("Not logged in.", "muted");
    })();
  </script>
</body>
</html>
``
