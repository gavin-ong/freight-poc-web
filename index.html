<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freight PRD POC</title>
  <style>
    body{
      margin:0; min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#e9f1ff;
      background:
        radial-gradient(900px 500px at 20% 30%, rgba(35,110,255,.35), transparent 60%),
        radial-gradient(800px 500px at 75% 70%, rgba(0,255,225,.18), transparent 55%),
        linear-gradient(180deg, #071224, #0a2a45);
      display:flex; justify-content:center; align-items:flex-start;
      padding:54px 16px;
    }
    .card{
      width:min(520px, 100%);
      background:rgba(11,26,51,.85);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .head{
      padding:18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex; gap:12px; align-items:center;
    }
    .dot{
      width:28px; height:28px; border-radius:10px;
      background:linear-gradient(135deg, rgba(63,187,255,1), rgba(0,255,196,1));
    }
    .title{font-weight:700; font-size:14px;}
    .sub{opacity:.75; font-size:12px; margin-top:2px;}
    .body{padding:18px;}
    label{display:block; opacity:.75; font-size:12px; margin:10px 0 6px;}
    input{
      width:100%; height:38px; border-radius:10px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.07);
      color:#e9f1ff;
      padding:0 12px; outline:none;
    }
    button{
      margin-top:14px;
      height:36px; border-radius:10px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(31,99,255,1), rgba(15,61,179,1));
      color:#e9f1ff;
      padding:0 14px; font-weight:700;
      cursor:pointer;
    }
    #status{margin-top:10px; font-size:12px; opacity:.85; word-break:break-word;}
    .build{margin-top:10px; font-size:11px; opacity:.75; font-family: ui-monospace, Menlo, Consolas, monospace;}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="dot"></div>
      <div>
        <div class="title">CargoWise-ish MVP</div>
        <div class="sub">Recovery mode (must show UI)</div>
      </div>
    </div>
    <div class="body">
      <div class="build">BUILD OK: RECOVERY-2 (HTML)</div>

      <label>Email</label>
      <input id="email" type="email" autocomplete="username"/>

      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password"/>

      <button id="btnLogin">Login</button>

      <div id="status">Ready.</div>
    </div>
  </div>

  <!-- ✅ REAL script tag (do NOT break this line) -->
  <script defer src="./app.js?v=recovery2"></script>
</body>
</html>
