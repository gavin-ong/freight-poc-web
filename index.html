<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freight PRD POC</title>

  <!-- Supabase JS (must be a valid script tag) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 18px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; }
    input, select, button { padding: 6px; }
    hr { margin: 18px 0; }
    .muted { color:#666; font-size:12px; }
    ul { margin-top:8px; }
    .pill { background:#f3f3f3; padding:2px 8px; border-radius:999px; }
  </style>
</head>

<body>
  <h2>Login</h2>
  <div class="row">
    <input id="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button onclick="login()">Login</button>
    <div id="loginStatus" class="muted"></div>
  </div>

  <hr />

  <h2>Create Job (CargoWise Format)</h2>

  <div class="row">
    <label>Branch</label>
    <!-- ✅ Branches will be loaded from DB -->
    <select id="branchKey" disabled>
      <option value="">Login to load branches…</option>
    </select>

    <label>Mode</label>
    <select id="mode">
      <option value="SEA">SEA (S)</option>
      <option value="AIR">AIR (A)</option>
      <option value="LAND">LAND (L)</option>
      <option value="INTEGRATED">INTEGRATED (I)</option>
    </select>

    <label>Job Type</label>
    <select id="jobType">
      <option value="EXPORT">EXPORT (O)</option>
      <option value="IMPORT">IMPORT (I)</option>
    </select>

    <label>Incoterm</label>
    <select id="incoterm">
      <option value="FOB">FOB</option>
      <option value="CIF">CIF</option>
      <option value="EXW">EXW</option>
    </select>
  </div>

  <div class="row">
    <input id="customer" placeholder="Customer Name (e.g. CUST-001)" />
    <input id="origin" placeholder="Origin Country (e.g. CN)" />
    <input id="destination" placeholder="Destination Country (e.g. SG)" />
    <button onclick="createJob()">Create Job</button>
  </div>

  <div class="row muted">
    <span class="pill">Branch dropdown is loaded from DB (public.branches)</span>
    <span class="pill">Created time shown in branch timezone</span>
    <span class="pill">YYMM counter follows branch-local date (DB)</span>
  </div>

  <hr />

  <h2>Jobs List</h2>
  <div class="row">
    <button onclick="loadJobs()">Refresh Jobs</button>
    <span class="muted">Shows latest 50</span>
  </div>
  <ul id="jobsList"></ul>

  <!-- ✅ Cache-bust JS to force Cloudflare/browser to fetch the newest version -->
  <script src="./app.js?v=autoload_branches_fix_20260512"></script>
</body>
</html>
